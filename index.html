\nNew York Time Series:\")\nprint(new_york_series)\n--------------------------------------------------\n# 6. Combine two different timezone series\n--------------------------------------------------\ncombined_series = pd.concat([\n    india_series,\n    new_york_series\n])\nprint(\"\\n6. Combined Time Series:\")\nprint(combined_series)\n# Sample Output\n### 1. Date Range with Time Zone\n# 1. Date Range with Asia/Kolkata Time Zone:\nDatetimeIndex(['2026-01-01 09:00:00+05:30',\n               '2026-01-01 10:00:00+05:30',\n               '2026-01-01 11:00:00+05:30'],\n              dtype='datetime64[ns, Asia/Kolkata]', freq='h')\n### 2. Timezone-Naive Date Range\n# 2. Timezone-naive Date Range:\nDatetimeIndex(['2026-01-01 09:00:00',\n               '2026-01-01 10:00:00',\n               '2026-01-01 11:00:00'],\n              dtype='datetime64[ns]', freq='h')\n### 3. Localized Time Zone\n# 3. After Localizing to Asia/Kolkata:\nDatetimeIndex(['2026-01-01 09:00:00+05:30',\n               '2026-01-01 10:00:00+05:30',\n               '2026-01-01 11:00:00+05:30'],\n              dtype='datetime64[ns, Asia/Kolkata]', freq='h')\n### 4. Converted to New York Time\n# 4. Converted to America/New_York:\nDatetimeIndex(['2025-12-31 22:30:00-05:00',\n               '2025-12-31 23:30:00-05:00',\n               '2026-01-01 00:30:00-05:00'],\n              dtype='datetime64[ns, America/New_York]', freq='h')\n### 5. Time Series\n# 5. India Time Series:\n2026-01-01 09:00:00+05:30    100\n2026-01-01 10:00:00+05:30    200\n2026-01-01 11:00:00+05:30    300\ndtype: int64\nNew York Time Series:\n2025-12-31 22:30:00-05:00    400\n2025-12-31 23:30:00-05:00    500\n2026-01-01 00:30:00-05:00    600\ndtype: int64\n### 6. Combined Time Series\n# 6. Combined Time Series:\n2025-12-31 22:30:00-05:00    400\n2025-12-31 23:30:00-05:00    500\n2026-01-01 00:30:00-05:00    600\n2026-01-01 09:00:00+05:30    100\n2026-01-01 10:00:00+05:30    200\n2026-01-01 11:00:00+05:30    300\ndtype: int64\nPerform period arithmetic such as adding and subtracting integers from periods and construct range of periods using period_range function.", "aim": "To generate date ranges by setting a time zone, localizing a time zone, converting timestamps to another time zone using tz_convert(), and combining time-series data from two different time zones using Pandas."}, {"html": "<h3>Aim<\/h3><p>To perform period arithmetic by adding and subtracting integers from Pandas Period objects and to construct a range of periods using the period_range() function.<\/p><h3>Syntax<\/h3><h3>1. Create a Period<\/h3><p>pd.Period(&#x27;2026-01&#x27;, freq=&#x27;M&#x27;)<\/p><h3>2. Add an integer to a Period<\/h3><p>period + integer<\/p><h3>3. Subtract an integer from a Period<\/h3><p>period - integer<\/p><h3>4. Construct a range of periods<\/h3><p>pd.period_range(start, periods=n, freq=&#x27;M&#x27;)<\/p><h3>Program Solution<\/h3>", "code": "import pandas as pd\n# Create a monthly Period\np = pd.Period('2026-01', freq='M')\nprint(\"Original Period:\")\nprint(p)\n# Add integers to the period\nprint(\"\\nAfter adding 2:\")\nprint(p + 2)\nprint(\"\\nAfter adding 5:\")\nprint(p + 5)\n# Subtract integers from the period\nprint(\"\\nAfter subtracting 1:\")\nprint(p - 1)\nprint(\"\\nAfter subtracting 3:\")\nprint(p - 3)\n# Create a range of monthly periods\nperiods = pd.period_range(\n    start='2026-01',\n    periods=6,\n    freq='M'\n)\nprint(\"\\nRange of Periods:\")\nprint(periods)\n# Sample Output\nOriginal Period:\n2026-01\nAfter adding 2:\n2026-03\nAfter adding 5:\n2026-06\nAfter subtracting 1:\n2025-12\nAfter subtracting 3:\n2025-10\nRange of Periods:\nPeriodIndex(['2026-01', '2026-02', '2026-03',\n             '2026-04', '2026-05', '2026-06'],\n            dtype='period[M]')\nConvert Periods and Periodlndex objects to another frequency with asfreq method.", "aim": "To perform period arithmetic by adding and subtracting integers from Pandas Period objects and to construct a range of periods using the period_range() function."}, {"html": "<h3>Aim<\/h3><p>To convert Pandas Period and PeriodIndex objects from one frequency to another using the asfreq() method.<\/p><h3>Syntax<\/h3><h3>1. Convert a Period to another frequency<\/h3><p>period.asfreq(freq, how=&#x27;start&#x27;)<\/p><h3>2. Convert a PeriodIndex to another frequency<\/h3><p>period_index.asfreq(freq, how=&#x27;start&#x27;)<\/p><h3>Parameters<\/h3><p>- freq \u2013 The target frequency, such as &#x27;D&#x27;, &#x27;M&#x27;, &#x27;Q&#x27;, or &#x27;Y&#x27;.<\/p><p>- how \u2013 Specifies whether to use the start or end of the period.<\/p><p>- &#x27;start&#x27; \u2013 Beginning of the period.<\/p><p>- &#x27;end&#x27; \u2013 End of the period.<\/p><h3>Program Solution<\/h3>", "code": "import pandas as pd\n--------------------------------------------------\n# 1. Create a monthly Period\n---------------------------------------------------\np = pd.Period('2026-01', freq='M')\nprint(\"Original Period:\")\nprint(p)\n---------------------------------------------------\n# 2. Convert monthly Period to daily frequency\n---------------------------------------------------\ndaily_start = p.asfreq('D', how='start')\nprint(\"\\nMonthly Period converted to Daily (Start):\")\nprint(daily_start)\ndaily_end = p.asfreq('D', how='end')\nprint(\"\\nMonthly Period converted to Daily (End):\")\nprint(daily_end)\n---------------------------------------------------\n 3. Create a PeriodIndex\n ---------------------------------------------------\nperiod_index = pd.period_range(\n    start='2026-01',\n    periods=3,\n    freq='M'\n)\nprint(\"\\nOriginal PeriodIndex:\")\nprint(period_index)\n ---------------------------------------------------\n 4. Convert PeriodIndex to daily frequency\n ---------------------------------------------------\ndaily_period_index = period_index.asfreq(\n    'D',\n    how='start'\n)\nprint(\"\\nPeriodIndex converted to Daily Frequency:\")\nprint(daily_period_index)\n ---------------------------------------------------\n 5. Convert PeriodIndex to daily frequency at end\n ---------------------------------------------------\ndaily_period_index_end = period_index.asfreq(\n    'D',\n    how='end'\n)\nprint(\"\\nPeriodIndex converted to Daily Frequency (End):\")\nprint(daily_period_index_end)\n# Sample Output\nOriginal Period:\n2026-01\nMonthly Period converted to Daily (Start):\n2026-01-01\nMonthly Period converted to Daily (End):\n2026-01-31\nOriginal PeriodIndex:\nPeriodIndex(['2026-01', '2026-02', '2026-03'],\n            dtype='period[M]')\nPeriodIndex converted to Daily Frequency:\nPeriodIndex(['2026-01-01', '2026-02-01', '2026-03-01'],\n            dtype='period[D]')\nPeriodIndex converted to Daily Frequency (End):\nPeriodIndex(['2026-01-31', '2026-02-28', '2026-03-31'],\n            dtype='period[D]')\nConvert Series and DataFrame objects indexed by timestamps to periods with the to_period method.", "aim": "To convert Pandas Period and PeriodIndex objects from one frequency to another using the asfreq() method."}, {"html": "<h3>Aim<\/h3><p>To convert Series and DataFrame objects indexed by timestamps into Period and PeriodIndex objects using the Pandas to_period() method.<\/p><h3>Syntax<\/h3><h3>1. Convert a Series to a PeriodIndex<\/h3><p>series.to_period(freq)<\/p><h3>2. Convert a DataFrame to a PeriodIndex<\/h3><p>dataframe.to_period(freq)<\/p><p>Where:<\/p><p>- freq specifies the desired frequency.<\/p><p>- &#x27;D&#x27; \u2192 Daily<\/p><p>- &#x27;M&#x27; \u2192 Monthly<\/p><p>- &#x27;Q&#x27; \u2192 Quarterly<\/p><p>- &#x27;Y&#x27; \u2192 Yearly<\/p><h3>Program Solution<\/h3>", "code": "import pandas as pd\n--------------------------------------------------\n 1. Create a Series with timestamp index\n--------------------------------------------------\ndates = pd.to_datetime([\n    '2026-01-10',\n    '2026-02-15',\n    '2026-03-20',\n    '2026-04-25'\n])\nsales = pd.Series(\n    [1000, 1500, 1800, 2200],\n    index=dates\n)\nprint(\"Original Series:\")\nprint(sales)\n--------------------------------------------------\n 2. Convert Series from timestamps to monthly periods\n-------------------------------------------------\nperiod_series = sales.to_period('M')\nprint(\"\\nSeries converted to Monthly Periods:\")\nprint(period_series)\n--------------------------------------------------\n# 3. Create a DataFrame with timestamp index\n--------------------------------------------------\ndf = pd.DataFrame(\n    {\n        'Sales': [1000, 1500, 1800, 2200],\n        'Profit': [200, 300, 400, 500]\n    },\n    index=dates\n)\nprint(\"\\nOriginal DataFrame:\")\nprint(df)\n --------------------------------------------------\n 4. Convert DataFrame to monthly periods\n --------------------------------------------------\nperiod_df = df.to_period('M')\nprint(\"\\nDataFrame converted to Monthly Periods:\")\nprint(period_df)\n# Sample Output\n### 1. Original Series\nOriginal Series:\n2026-01-10    1000\n2026-02-15    1500\n2026-03-20    1800\n2026-04-25    2200\ndtype: int64\n### 2. Series Converted to Monthly Periods\nSeries converted to Monthly Periods:\n2026-01    1000\n2026-02    1500\n2026-03    1800\n2026-04    2200\nFreq: M, dtype: int64\n### 3. Original DataFrame\nOriginal DataFrame:\n            Sales  Profit\n2026-01-10   1000     200\n2026-02-15   1500     300\n2026-03-20   1800     400\n2026-04-25   2200     500\n### 4. DataFrame Converted to Monthly Periods\nDataFrame converted to Monthly Periods:\n         Sales  Profit\n2026-01   1000     200\n2026-02   1500     300\n2026-03   1800     400\n2026-04   2200     500\nFreq: M\nPerform resampling, downsampling and upsampling for the time series.", "aim": "To convert Series and DataFrame objects indexed by timestamps into Period and PeriodIndex objects using the Pandas to_period() method."}, {"html": "<h3>Aim<\/h3><p>To perform resampling, downsampling, and upsampling operations on a time series using Pandas.<\/p><h3>Syntax<\/h3><h3>1. Resampling<\/h3><p>series.resample(&#x27;frequency&#x27;).aggregation_function()<\/p><p>Example:<\/p><p>series.resample(&#x27;D&#x27;).mean()<\/p><h3>2. Downsampling<\/h3><p>series.resample(&#x27;larger_frequency&#x27;).sum()<\/p><p>Example:<\/p><p>series.resample(&#x27;6h&#x27;).sum()<\/p><h3>3. Upsampling<\/h3><p>series.resample(&#x27;smaller_frequency&#x27;).asfreq()<\/p><p>or<\/p><p>series.resample(&#x27;smaller_frequency&#x27;).ffill()<\/p><h3>Program Solution<\/h3>", "code": "import pandas as pd\n --------------------------------------------------\n 1. Create an hourly time series\n --------------------------------------------------\ndates = pd.date_range(\n    start='2026-01-01 00:00',\n    periods=12,\n    freq='h'\n)\nvalues = [10, 12, 15, 14, 18, 20,\n          22, 21, 25, 28, 30, 32]\ntime_series = pd.Series(\n    values,\n    index=dates\n)\nprint(\"Original Hourly Time Series:\")\nprint(time_series)\n --------------------------------------------------\n 2. Resampling - calculate 3-hourly mean\n --------------------------------------------------\nresampled = time_series.resample('3h').mean()\nprint(\"\\nResampled Time Series - 3 Hour Mean:\")\nprint(resampled)\n --------------------------------------------------\n 3. Downsampling - Hourly to 4-hourly\n --------------------------------------------------\ndownsampled = time_series.resample('4h').sum()\nprint(\"\\nDownsampled Time Series - 4 Hour Sum:\")\nprint(downsampled)\n --------------------------------------------------\n 4. Upsampling - Hourly to 30-minute intervals\n --------------------------------------------------\nupsampled = time_series.resample('30min').asfreq()\nprint(\"\\nUpsampled Time Series - 30 Minute:\")\nprint(upsampled)\n --------------------------------------------------\n 5. Upsampling with Forward Fill\n --------------------------------------------------\nupsampled_ffill = time_series.resample('30min').ffill()\nprint(\"\\nUpsampled Time Series using Forward Fill:\")\nprint(upsampled_ffill)\n# Sample Output\n## 1. Original Time Series\nOriginal Hourly Time Series:\n2026-01-01 00:00:00    10\n2026-01-01 01:00:00    12\n2026-01-01 02:00:00    15\n2026-01-01 03:00:00    14\n2026-01-01 04:00:00    18\n2026-01-01 05:00:00    20\n2026-01-01 06:00:00    22\n2026-01-01 07:00:00    21\n2026-01-01 08:00:00    25\n2026-01-01 09:00:00    28\n2026-01-01 10:00:00    30\n2026-01-01 11:00:00    32\nFreq: h, dtype: int64\n## 2. Resampling\nThe hourly data is resampled into 3-hour intervals and the mean is calculated.\nResampled Time Series - 3 Hour Mean:\n2026-01-01 00:00:00    12.333333\n2026-01-01 03:00:00    17.333333\n2026-01-01 06:00:00    22.666667\n2026-01-01 09:00:00    30.000000\nFreq: 3h, dtype: float64\nFor example:\n(10 + 12 + 15) / 3 = 12.33\n## 3. Downsampling\nHourly data is reduced to 4-hour intervals and the values are summed.\nDownsampled Time Series - 4 Hour Sum:\n2026-01-01 00:00:00    51\n2026-01-01 04:00:00    81\n2026-01-01 08:00:00    115\nFreq: 4h, dtype: int64\nFor example:\n10 + 12 + 15 + 14 = 51\n## 4. Upsampling\nHourly data is increased to 30-minute intervals.\nUpsampled Time Series - 30 Minute:\n2026-01-01 00:00:00    10.0\n2026-01-01 00:30:00     NaN\n2026-01-01 01:00:00    12.0\n2026-01-01 01:30:00     NaN\n2026-01-01 02:00:00    15.0\n2026-01-01 02:30:00     NaN\n2026-01-01 03:00:00    14.0\n...\nFreq: 30min, dtype: float64\nThe newly created 30-minute timestamps contain NaN because no original observation exists at those times.\n## 5. Upsampling Using Forward Fill\nThe missing values can be filled using ffill():\nUpsampled Time Series using Forward Fill:\n2026-01-01 00:00:00    10\n2026-01-01 00:30:00    10\n2026-01-01 01:00:00    12\n2026-01-01 01:30:00    12\n2026-01-01 02:00:00    15\n2026-01-01 02:30:00    15\n2026-01-01 03:00:00    14\n...\nFreq: 30min, dtype: int64\n# My Programs :\n# Time Series Analysis\na. Create Time Series\nrng = pd.date_range('2023-01-01', periods=6, freq='D')\nts = pd.Series(np.random.randn(len(rng)), index=rng)\nprint(ts)\nb. Time Zone Conversion\nts_utc = ts.tz_localize('UTC')\nts_ind = ts_utc.tz_convert('Asia/Kolkata')\nprint(ts_ind)\nc. Period Arithmetic and Conversion\np = pd.Period('2024Q1')\nprint(p + 1)\nprint(p.asfreq('M', 'end'))\nd. Resampling\nts = pd.Series(np.random.randn(100),\n               index=pd.date_range('2024-01-01', periods=100))\nts_monthly = ts.resample('M').mean()\nprint(ts_monthly)", "aim": "To perform resampling, downsampling, and upsampling operations on a time series using Pandas."}]}}},LOGO="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAWgAAADPCAYAAADYi0s3AADa40lEQVR42uy9d5xlR3nn/X2qzjk3dQ7Tk3OQRqMckEAEgWHJJspgkrEJNmBY29hre3eN5XVYx3e93sWLE0sytmQyNpicJSEkoayRRqPJoXO66Zyqet4/zu2enpEmd8MM2w+fi2bu3HtunedU/eqp35PgBPLXA2vWvn/16m4W5byWPx0YqLx/+ZYti5pYlEU5v8Sc6B970/gt6uK2RTWd35K0t1sj/i0f4Mp4URuLsig/AQB9c+fmdZE3Lw828otqOr9ltNrp2rLw3L6O0csWtbEoi/ITANAl0p9CdF3TO7uopvNbhtweU8zS5UVJX7yojUVZlJ8AgK5H/nmYUGpvusqims5vubZmygXvSwLPed9JaK1FWZRFOccB+h1bt7ZVE3NlTGB50/Qvqun8lg6RPsHHDrZtWbVl6aJGFmVRzmOA7nRufTPSFWIcRsOqRTWd56I6YIWCiOmcaoatiwpZlEU5jwE6iRqbidMEm+GMWwzPOs8lK0UbxRhcIaEZswjQi7Io5zNAL5lKt3Q0FQmBeiFctqim81sEe4UYUKmjprm44S7KopzPAL1yQtf018B6wSiX3ty9vnNRVeenvA+iYsNfrSpARodvrF3UyqIsynkM0M76Jc4o4oXupqxKgr9iUVXnp6wb6N7iIr/VhYhyBr3Net9iJMeiLMp5CtAKEozpdiJkxmGMM7FLX72oqvNTOprxyyQJJWc8QSwqtn3DwEBpUTOLsijnIUD/Ls+0hazYboNF2g2hFMD6l//JmjWL4VnnmfzpwEClVuB1UUFpaxecU9QXSz2NQrKonUVZlPMQoC9iyFj1BckCAxcOEF9YAdNcurZmf25RXeeXrMmyV1bS+oXlZZbuS/txziNBkppPo0XtLMqinIcAvRVQWzeqAbobrHrecsREtDcb7/xg/6IVfb7Izf39bYXAr5ecsOqGFZg1KagCmbG5x3BRFmVRzjeAfhBQNIDiXJNV13aTbChifFjZldV+Y1Fl54eoC78YB91mBhJW39CP9ykAIgQvoosaWpRFOT8A+ihrqp/+AHFDRQmpIe5S1rxiORNxg0jlF2/p7n/qotrOceu5ffmWkuO3muJY/pLlxEsh1GIia1CjaWYTd8xXFi3qRVmUcxGgv8fK4peTvs0zbzyLb3pVmQ4S8Cn41LDiuWX6nlJEg5Qijf7nd+htX1TdOQrObE0Sjf5HEuhp25qw5lXthDTg64qIEoRaezlrznz+3wobN3yaLYs1vxdlUc5FgG5itRbpyz8AccuUUpUwKjZQm2qgDUWiBttevwLXLSTolYOd5T9aVN05+kA7st8oWJ6fdjguef06Cu2ekDpq41UUB0Em7zx4sDHz+aZNXxl11hedhouyKOfien4Wu5uhULq+b8nGK2fe9HBYrDA1PYUbc9hGQudFJTa+tp8adQri3/H5toFfWFTfuSWfLXW9pKK async function loadScript(url){
 return new Promise((resolve,reject)=>{
  const x=document.createElement('script');
  x.src=url;x.onload=()=>resolve();x.onerror=()=>reject(new Error('Could not load '+url));
  document.head.appendChild(x)
 })
}

}

 home(){return `<img class="logo" src="${LOGO}" alt="MBU"><div class="top"><div class="brand"><div class="hicon">🏠</div><div><small>HOME</small><h1>DATA SCIENCE</h1><div class="sub">SUBJECT: DIGITAL LIBRARY</div>${nav}</div></div>${stuBox(false)}</div>
 <div class="grid2"><div class="card"><h2>📚 MODULES</h2><div class="boxes">${boxes(5,'module')}</div></div><div class="card"><h2>🧪 LAB EXPERIMENTS</h2><div class="boxes">${boxes(10,'exp')}</div></div><div class="card"><h2>🛠️ TOOLS</h2><div class="boxes"><button class="box" onclick="go('tools')">Open Tools</button></div><p class="note">Run real Data Science experiments directly in the browser with Pyodide.</p></div></div>`},
 edit(){return views.home().replace(stuBox(false),stuBox(true))},
 id(){return head('STUDENT ID CARD')+`<div style="margin-top:20px">${idCard()}</div>`},
 modules(){return head('MODULES')+`<div class="boxes big" style="margin-top:22px">${Array.from({length:5},(_,i)=>`<button class="box" onclick="go('module/${i+1}')">Module ${i+1}</button>`).join('')}</div>`},
 module(n){return head('MODULE '+n)+ed('mod'+n,D.mods[n-1])},
 exps(){return head('LAB EXPERIMENTS')+`<div class="rows">${Array.from({length:10},(_,i)=>{const e=D.exps[i+1];return `<button class="box row" onclick="go('exp/${i+1}')">Experiment ${i+1}${e&&e.parts.length>1?` <small>· ${e.parts.length} sub-experiments</small>`:''}</button>`}).join('')}</div>`},
 exp(n,k){const e=D.exps[n],L='abcdefghijklmnop';
  if(k==null)return head('LAB EXPERIMENTS · Experiment '+n)+`<h2 style="color:var(--cyan);margin:20px 0 0">EXPERIMENT ${n}</h2><div class="boxes big" style="margin-top:12px"><button class="box" onclick="go('exp/${n}/all')">${n}</button>${e&&e.parts.length>1?e.parts.map((p,i)=>`<button class="box" onclick="go('exp/${n}/${i}')">${n}${L[i]}</button>`).join(''):''}</div>`;
  const all=k==='all',p=e?(all?e:e.parts[+k]):null,t=all?n:n+L[+k],id=n+'_'+k;
  const body=p?p.html:`<h3>Experiment ${n}</h3><p>Click “Edit content” to add the aim, syntax and procedure.</p>`;
  return head('LAB EXPERIMENTS · Experiment '+t)+`<div class="cols"><div><h2 style="color:var(--cyan);margin:6px 0">EXPERIMENT ${t}</h2>${ed('exp'+id,body)}</div><div class="card"><h2>Overview</h2><div class="content" id="ov">${esc(ls.get('ov'+id,p?p.aim:'Add an overview for this experiment.'))}</div><div class="bar"><button class="btn alt" onclick="editOv('${id}')">✏️ Edit overview</button></div></div></div>`+ide(p?p.code:ideDefault,'code'+id)},
 tools(){return head('TOOLS · CODE PLAYGROUND')+ide(ideDefault,'codeT')},
 about(){return head('ABOUT ME')+`<h1 style="color:var(--cyan);font-size:clamp(28px,4vw,42px);margin:20px 0 0">ABOUT ME</h1><div class="cols"><div class="card"><h2 style="color:var(--cyan);margin-top:0">ABOUT ME</h2>${ed('about',aboutP+'<h2 style="color:var(--cyan)">RESUME</h2>'+resume)}</div><div><h2 style="color:var(--cyan);margin-top:0">ID CARD DETAILS</h2>${idCard()}</div></div>`}
};
function editOv(n){const o=$('#ov');if(o.contentEditable==='true'){ls.set('ov'+n,o.innerText);o.contentEditable='false'}else{o.contentEditable='true';o.focus()}}
function route(edit){const p=(location.hash.replace(/^#\/?/,'')||'').split('/');let v=p[0]||'home';if(edit===true)v='edit';
 const f=views[v]||views.home;$('#app').innerHTML=f(+p[1]||p[1],p[2]);window.scrollTo(0,0);initCompiler()}
(function(){
 const c=$('#bg'),x=c.getContext('2d');let W,H,DPR;
 const stars=[];
 function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0);
  if(stars.length===0){for(let i=0;i<650;i++)stars.push({x:(Math.random()-.5)*2.2,y:(Math.random()-.5)*1.45,z:Math.random()*1.0+.02,p:Math.random()*6.28})}
 }
 resize();addEventListener('resize',resize);
 function draw(t){
  x.clearRect(0,0,W,H);
  // Deep-space galaxy glow: layered nebula, no rotating object.
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#01030d');bg.addColorStop(.48,'#04112b');bg.addColorStop(1,'#01030a');x.fillStyle=bg;x.fillRect(0,0,W,H);
  const neb=x.createRadialGradient(W*.50,H*.48,0,W*.50,H*.48,Math.max(W,H)*.62);neb.addColorStop(0,'rgba(35,130,255,.16)');neb.addColorStop(.28,'rgba(75,55,220,.10)');neb.addColorStop(.58,'rgba(0,190,255,.045)');neb.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=neb;x.fillRect(0,0,W,H);
  // A subtle 3D galaxy disk.
  x.save();x.translate(W*.5,H*.52);x.rotate(-.12);x.scale(1,.24);
  const disk=x.createRadialGradient(0,0,0,0,0,Math.min(W,H)*.58);disk.addColorStop(0,'rgba(220,245,255,.25)');disk.addColorStop(.08,'rgba(80,190,255,.17)');disk.addColorStop(.34,'rgba(65,90,255,.09)');disk.addColorStop(.72,'rgba(45,30,180,.025)');disk.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=disk;x.beginPath();x.arc(0,0,Math.min(W,H)*.58,0,Math.PI*2);x.fill();x.restore();
  // Perspective star depth: stars sit on different Z planes and gently travel toward the viewer.
  const cx=W*.5,cy=H*.52;
  stars.forEach(s=>{
   s.z-=.00022; if(s.z<.012){s.z=1;s.x=(Math.random()-.5)*2.2;s.y=(Math.random()-.5)*1.45}
   const q=1/s.z;const px=cx+s.x*q*Math.min(W,H)*.24;const py=cy+s.y*q*Math.min(W,H)*.24;
   if(px<-80||px>W+80||py<-80||py>H+80)return;
   const r=Math.min(3.2,.45+q*1.05);const tw=.72+.28*Math.sin(t*.0012+s.p);
   x.fillStyle='rgba(205,235,255,'+(.22+.62*Math.min(1,q/5))*tw+')';
   x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();
   if(q>3.8){x.strokeStyle='rgba(110,205,255,.28)';x.lineWidth=.7;x.beginPath();x.moveTo(px,py);x.lineTo(cx+(px-cx)*.94,cy+(py-cy)*.94);x.stroke()}
  });
  requestAnimationFrame(draw)
 }draw(0);
})();
window.addEventListener('hashchange',()=>route());route();
</script></body></html>
